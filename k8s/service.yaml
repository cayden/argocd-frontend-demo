apiVersion: v1
kind: Service
metadata:
  name: frontend-demo
  namespace: default
spec:
  # 节点端口 30080 已让给 crud-gitops 的 crud-frontend
  # 本 demo 改为 ClusterIP，需要访问时用：
  #   kubectl port-forward svc/frontend-demo -n default 8081:80
  type: ClusterIP
  selector:
    app: frontend-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
